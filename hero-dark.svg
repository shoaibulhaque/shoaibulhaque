<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Systems, end to end</title>
  <desc id="desc">A minimal abstract banner for backend, cloud, systems and AI engineering.</desc>

  <defs>
    <clipPath id="right-zone"><rect x="720" y="0" width="480" height="360" rx="28"/></clipPath>
    <linearGradient id="fade-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#0A0D12"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#202630"/>

  <!-- Protected text zone: x=64..650 -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="78" fill="#7DD3FC" font-size="13" font-weight="700" letter-spacing="2.8">BACKEND / CLOUD / SYSTEMS / AI</text>
    <text x="64" y="164" fill="#F7F8FA" font-size="50" font-weight="700" letter-spacing="0.4">SYSTEMS, END TO END.</text>
    <text x="66" y="212" fill="#9CA3AF" font-size="19" font-weight="400">from request → runtime → reliability</text>

    <line x1="66" y1="258" x2="530" y2="258" stroke="#202630"/>
    <text x="66" y="297" fill="#626B78" font-size="12" font-weight="700" letter-spacing="1.8">BUILD · TRACE · OBSERVE · SCALE</text>
  </g>

  <!-- Abstract system field: clipped entirely to the right zone -->
  <g clip-path="url(#right-zone)">
    <g opacity="0.45" stroke="#17202B" stroke-width="1">
      <line x1="760" y1="0" x2="760" y2="360"/><line x1="820" y1="0" x2="820" y2="360"/>
      <line x1="880" y1="0" x2="880" y2="360"/><line x1="940" y1="0" x2="940" y2="360"/>
      <line x1="1000" y1="0" x2="1000" y2="360"/><line x1="1060" y1="0" x2="1060" y2="360"/>
      <line x1="1120" y1="0" x2="1120" y2="360"/>
      <line x1="720" y1="60" x2="1200" y2="60"/><line x1="720" y1="120" x2="1200" y2="120"/>
      <line x1="720" y1="180" x2="1200" y2="180"/><line x1="720" y1="240" x2="1200" y2="240"/>
      <line x1="720" y1="300" x2="1200" y2="300"/>
    </g>

    <g transform="translate(958 180)">
      <circle r="112" fill="#0A0D12" stroke="#26313E" stroke-width="1.2"/>
      <circle r="78" fill="none" stroke="#1F2937" stroke-width="1" stroke-dasharray="3 8"/>
      <circle r="42" fill="#0D1117" stroke="#334155" stroke-width="1.2"/>
      <circle r="6" fill="#E5E7EB"/>

      <path d="M-176 -42 C-120 -92,-61 -90,-18 -48 S61 8,116 -39 S182 -82,226 -52" fill="none" stroke="#334155" stroke-width="1.3"/>
      <path d="M-194 62 C-130 22,-85 14,-41 50 S45 105,101 73 S174 27,226 52" fill="none" stroke="#273241" stroke-width="1.2"/>
      <path d="M-130 -142 C-70 -106,-42 -61,-11 -12 S50 62,105 112" fill="none" stroke="#1F2937" stroke-width="1.1"/>

      <circle cx="-176" cy="-42" r="4" fill="#38BDF8"/>
      <circle cx="-18" cy="-48" r="4" fill="#64748B"/>
      <circle cx="116" cy="-39" r="4" fill="#E5E7EB"/>
      <circle cx="-194" cy="62" r="4" fill="#64748B"/>
      <circle cx="-41" cy="50" r="4" fill="#38BDF8"/>
      <circle cx="101" cy="73" r="4" fill="#64748B"/>
      <circle cx="-130" cy="-142" r="4" fill="#64748B"/>
      <circle cx="105" cy="112" r="4" fill="#38BDF8"/>

      <line x1="-260" y1="0" x2="-126" y2="0" stroke="url(#fade-line)" stroke-width="1.2"/>
      <line x1="126" y1="0" x2="260" y2="0" stroke="url(#fade-line)" stroke-width="1.2"/>
    </g>
  </g>
</svg>
