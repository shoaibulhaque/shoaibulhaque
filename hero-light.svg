      <circle r="78" fill="none" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 8"/>
      <circle r="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <circle r="6" fill="#111827"/>

      <path d="M-176 -42 C-120 -92,-61 -90,-18 -48 S61 8,116 -39 S182 -82,226 -52" fill="none" stroke="#94A3B8" stroke-width="1.3"/>
      <path d="M-194 62 C-130 22,-85 14,-41 50 S45 105,101 73 S174 27,226 52" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
      <path d="M-130 -142 C-70 -106,-42 -61,-11 -12 S50 62,105 112" fill="none" stroke="#D1D5DB" stroke-width="1.1"/>

      <circle cx="-176" cy="-42" r="4" fill="#0284C7"/>
      <circle cx="-18" cy="-48" r="4" fill="#64748B"/>
      <circle cx="116" cy="-39" r="4" fill="#111827"/>
      <circle cx="-194" cy="62" r="4" fill="#64748B"/>
      <circle cx="-41" cy="50" r="4" fill="#0284C7"/>
      <circle cx="101" cy="73" r="4" fill="#64748B"/>
      <circle cx="-130" cy="-142" r="4" fill="#64748B"/>
      <circle cx="105" cy="112" r="4" fill="#0284C7"/>

