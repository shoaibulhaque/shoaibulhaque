<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">System trace</title>
  <desc id="desc">A linear system trace from request through edge, app, data, asynchronous work, cloud and observability.</desc>

  <rect width="1200" height="160" rx="24" fill="#0A0D12"/>
  <rect x="1" y="1" width="1198" height="158" rx="23" fill="none" stroke="#202630"/>

  <line x1="94" y1="80" x2="1106" y2="80" stroke="#273241" stroke-width="1.4"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g fill="#0A0D12" stroke="#3A4655" stroke-width="1.2">
      <circle cx="94" cy="80" r="10"/><circle cx="263" cy="80" r="10"/><circle cx="432" cy="80" r="10"/>
      <circle cx="600" cy="80" r="10"/><circle cx="768" cy="80" r="10"/><circle cx="937" cy="80" r="10"/><circle cx="1106" cy="80" r="10"/>
    </g>
    <g fill="#38BDF8">
      <circle cx="94" cy="80" r="3"/><circle cx="432" cy="80" r="3"/><circle cx="768" cy="80" r="3"/><circle cx="1106" cy="80" r="3"/>
    </g>
    <g fill="#9CA3AF" font-size="12" font-weight="700" letter-spacing="1.3">
      <text x="94" y="48">REQUEST</text>
      <text x="263" y="48">EDGE</text>
      <text x="432" y="48">APP</text>
      <text x="600" y="48">DATA</text>
      <text x="768" y="48">ASYNC</text>
      <text x="937" y="48">CLOUD</text>
      <text x="1106" y="48">OBSERVE</text>
    </g>
    <g fill="#4B5563" font-size="10" font-weight="600" letter-spacing="1">
      <text x="94" y="117">01</text><text x="263" y="117">02</text><text x="432" y="117">03</text>
      <text x="600" y="117">04</text><text x="768" y="117">05</text><text x="937" y="117">06</text><text x="1106" y="117">07</text>
    </g>
  </g>
</svg>
